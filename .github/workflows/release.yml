name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Ejecutar en modo dry-run (no publica nada)'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write

# Si se mergean varios PRs seguidos, cada push a main dispara un run nuevo --
# sin esto corren en paralelo y semantic-release puede chocar al pushear el
# commit/tag de versión sobre un main que el otro run ya movió. Con esto, un
# run nuevo queda encolado (no cancela el que está corriendo) y arranca solo
# al terminar el anterior.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT de una cuenta admin: permite que el push del bump de versión
          # (@semantic-release/git) bypasee "Require PR" en main. El
          # GITHUB_TOKEN por defecto no es admin y ese push es rechazado
          # (GH006: Protected branch update failed).
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install release tooling
        run: npm ci

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > android/app/release.keystore

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run semantic-release
        run: npx semantic-release ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # El apk solo existe en el workspace si semantic-release efectivamente
      # publicó una versión nueva (ver release.config.js: publishCmd lo
      # compila ahí) -- en dry-run, o cuando "no hay cambios releasable", ese
      # paso ni corre. Por eso el guard es la existencia del archivo, no un
      # chequeo aparte de dry-run/inputs.
      #
      # Requiere, como secrets/variables del repo (ver runbook en el PR):
      #   MDM_CLIENT_ID / MDM_CLIENT_SECRET / MDM_REFRESH_TOKEN (OAuth Zoho,
      #   self-client con scope MDMOnDemand.MDMDeviceMgmt.CREATE)
      #   MDM_APP_ID / MDM_RELEASE_LABEL_ID (de la app ya creada una vez a
      #   mano en el App Repository de ManageEngine MDM)
      #   MDM_APP_NAME (nombre de la app tal cual aparece en ese App
      #   Repository -- la API lo exige al registrar cada versión nueva)
      - name: Publicar nueva versión del apk en ManageEngine MDM
        env:
          MDM_BASE_URL: https://mdm.manageengine.com
          MDM_ACCOUNTS_URL: https://accounts.zoho.com
          MDM_CLIENT_ID: ${{ secrets.MDM_CLIENT_ID }}
          MDM_CLIENT_SECRET: ${{ secrets.MDM_CLIENT_SECRET }}
          MDM_REFRESH_TOKEN: ${{ secrets.MDM_REFRESH_TOKEN }}
          MDM_APP_ID: ${{ vars.MDM_APP_ID }}
          MDM_RELEASE_LABEL_ID: ${{ vars.MDM_RELEASE_LABEL_ID }}
          MDM_APP_NAME: ${{ vars.MDM_APP_NAME }}
        run: |
          set -euo pipefail

          APK_FILE=$(ls build/app/outputs/flutter-apk/dipalza-release-*.apk 2>/dev/null | head -1 || true)
          if [[ -z "$APK_FILE" ]]; then
            echo "No se publicó una versión nueva en este run -- nada que subir a MDM."
            exit 0
          fi

          if [[ -z "${MDM_APP_ID:-}" || -z "${MDM_RELEASE_LABEL_ID:-}" ]]; then
            echo "::warning::MDM_APP_ID/MDM_RELEASE_LABEL_ID no están configurados -- se omite la publicación en ManageEngine MDM. Ver el runbook para el setup inicial (subir el apk una vez a mano en el App Repository)."
            exit 0
          fi

          VERSION=$(basename "$APK_FILE" | sed -E 's/dipalza-release-(.*)\.apk/\1/')
          echo "Publicando ${APK_FILE} (versión ${VERSION}) en MDM..."

          TOKEN_RESPONSE=$(curl -sS --request POST "${MDM_ACCOUNTS_URL}/oauth/v2/token" \
            --data-urlencode "refresh_token=${MDM_REFRESH_TOKEN}" \
            --data-urlencode "client_id=${MDM_CLIENT_ID}" \
            --data-urlencode "client_secret=${MDM_CLIENT_SECRET}" \
            --data-urlencode "grant_type=refresh_token")
          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')
          if [[ -z "$ACCESS_TOKEN" || "$ACCESS_TOKEN" == "null" ]]; then
            # La respuesta de Zoho ante un error NO incluye el refresh_token/client_secret
            # que mandamos -- es seguro mostrarla completa para diagnosticar.
            echo "::error::No se pudo obtener el access_token de Zoho. Respuesta: ${TOKEN_RESPONSE}"
            exit 1
          fi

          FILE_RESPONSE=$(curl -sS --request POST "${MDM_BASE_URL}/emsapi/files" \
            --header "Authorization: Zoho-oauthtoken ${ACCESS_TOKEN}" \
            --header "module: MDM_APP_MGMT" \
            --form "fileName=@${APK_FILE}")
          # La API responde a veces un objeto ({"fileID": ...}) y a veces un array
          # ([{"fileID": ...}]) -- se soportan ambas formas sin asumir cuál es. El
          # "|| true" evita que un error de tipo de jq aborte el script (set -e +
          # pipefail) antes de llegar al "if" de abajo, que es lo que pasó la
          # primera vez que esto falló (ver PR que agregó este comentario).
          FILE_ID=$(echo "$FILE_RESPONSE" | jq -r '
            if type == "array" then (.[0].fileID // empty)
            elif type == "object" then (.fileID // .data.fileID // empty)
            else empty end' 2>/dev/null || true)
          if [[ -z "$FILE_ID" || "$FILE_ID" == "null" ]]; then
            echo "::error::No se pudo subir el apk a MDM (sin fileID en la respuesta). Respuesta cruda: ${FILE_RESPONSE}"
            exit 1
          fi

          echo "Registrando versión ${VERSION} (fileID ${FILE_ID}) en app ${MDM_APP_ID}..."
          # La API exige también app_name/bundle_identifier en este PUT, aunque la
          # app ya exista. Se habían leído en vivo con un GET, pero ese endpoint
          # (/api/v1/mdm/apps/{app_id}) requiere el scope OAuth
          # MDMOnDemand.MDMDeviceMgmt.READ, que el Self Client actual no tiene
          # (solo CREATE) -- siempre devuelve 401. En vez de rehacer el Self
          # Client con más scopes, se usan valores fijos: bundle_identifier es
          # el package ID de Android (cl.eos.dipalza.movil, no cambia), y
          # app_name se toma de una variable del repo (MDM_APP_NAME) -- debe
          # configurarse una vez con el nombre tal cual aparece en el App
          # Repository de ManageEngine MDM.
          BUNDLE_IDENTIFIER_JSON='"cl.eos.dipalza.movil"'
          if [[ -z "${MDM_APP_NAME:-}" ]]; then
            echo "::warning::MDM_APP_NAME no está configurado -- se omite la publicación en ManageEngine MDM. Configurar esa variable del repo con el nombre de la app tal cual aparece en el App Repository de MDM."
            exit 0
          fi
          APP_NAME_JSON=$(jq -n --arg v "$MDM_APP_NAME" '$v')

          # app_type=2 (Enterprise App) y platform_type=2 (Android) son requeridos
          # por la API aunque la documentación no los marque como obligatorios --
          # sin ellos responde 400 "parameter app_type used is below the minimum
          # requirement" (IAM0021).
          curl -sS --fail-with-body --request PUT \
            "${MDM_BASE_URL}/api/v1/mdm/apps/${MDM_APP_ID}/labels/${MDM_RELEASE_LABEL_ID}" \
            --header "Authorization: Zoho-oauthtoken ${ACCESS_TOKEN}" \
            --header "content-type: application/json" \
            --data "{\"app_file\": ${FILE_ID}, \"app_version\": \"${VERSION}\", \"app_type\": 2, \"platform_type\": 2, \"app_name\": ${APP_NAME_JSON}, \"bundle_identifier\": ${BUNDLE_IDENTIFIER_JSON}, \"force_update_in_label\": false}"

          echo "Aprobando y distribuyendo la nueva versión a los dispositivos/grupos ya asociados..."
          curl -sS --fail-with-body --request POST \
            "${MDM_BASE_URL}/api/v1/mdm/apps/${MDM_APP_ID}/labels/${MDM_RELEASE_LABEL_ID}/approve" \
            --header "Authorization: Zoho-oauthtoken ${ACCESS_TOKEN}" \
            --header "content-type: application/json" \
            --data '{"silent_install": true, "retire_old_version": true, "notify_user_via_email": false, "distribute_update": true}'

          echo "Versión ${VERSION} publicada y distribuida en ManageEngine MDM."
